<!-- Anniversary Alert -->
<script>
(function () {
  const KEY = 'cbd_anniversary_alert';
  const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;   // ms

  let last = 0;
  try {
    last = parseInt(localStorage.getItem(KEY) || '0', 10) || 0;
  } catch (e) {
    // localStorage can throw in some privacy modes; fall through and skip the alert
    return;
  }

  const now = Date.now();
  if (now - last < THREE_DAYS) return;

  alert("Happy 2nd year of Coffee Byte Dev! 🎉 🎉 🎉");

  try {
    localStorage.setItem(KEY, String(now));
  } catch (e) {
    // ignore
  }
})();
</script>

<script>
async function loadNavigation() {
  const response = await fetch("./site_navigation.csv");
  if (!response.ok) throw new Error("Could not load navigation CSV.");

  const csv = await response.text();
  const rows = csv.trim().split(/\r?\n/).slice(1).map(parseCsvLine);

  const nav = document.getElementById("sidebar-nav");
  const categories = new Map();

  for (const row of rows) {
    const [category, icon, title, href, paper, date, words, minutes] = row;

    if (!categories.has(category)) {
      categories.set(category, []);
    }

    categories.get(category).push({
      icon, title, href, paper, date, words, minutes
    });
  }

  nav.innerHTML = [...categories.entries()].map(([category, pages]) => `
    <h3>
      <span class="sec-name">${escapeHtml(category)}</span>
      <span class="sec-rule"></span>
      <span class="sec-count">${String(pages.length).padStart(2, "0")}</span>
    </h3>
    <ul>
      ${pages.map(page => `
        <li>
          <a href="${escapeHtml(page.href)}"
             data-date="${escapeHtml(page.date)}"
             data-words="${escapeHtml(page.words)}"
             data-minutes="${escapeHtml(page.minutes)}">
            ${escapeHtml(page.icon)} ${escapeHtml(page.title)}
          </a>
        </li>
      `).join("")}
    </ul>
  `).join("");
}

function parseCsvLine(line) {
  const values = [];
  let current = "";
  let quoted = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (char === '"') {
      if (quoted && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (char === "," && !quoted) {
      values.push(current);
      current = "";
    } else {
      current += char;
    }
  }

  values.push(current);
  return values;
}

function escapeHtml(value) {
  const node = document.createElement("span");
  node.textContent = value;
  return node.innerHTML;
}

loadNavigation().catch(console.error);
</script>

  <script>
    // Read ?paper= once. Everything below uses this.
    const PAPER = new URLSearchParams(location.search).get('paper') || 'index';

    // 1) Router: point the brewdown placeholder at the right markdown file.
    //    Must happen BEFORE scripts.js runs processAll() on DOMContentLoaded.
    document.querySelector('script[data-brewdown]')
            .setAttribute('data-brewdown', `papers/${PAPER}.md`);

    // 2) First-line reader: set <h1>, document.title, window.icon/title.
    (async () => {
      const md = await (await fetch(`papers/${PAPER}.md`)).text();
      const firstLine = md.split('\n')[0];
      const match = firstLine.match(/^#\s+(\S+)\s+(.+?)\s*$/);
      if (!match) return;

      const [, icon, title] = match;
      window.icon  = icon;
      window.title = title;
      const h1 = document.querySelector('.download-bar h1');
      if (h1) h1.textContent = title;
    })();

    // 3) Sidebar: mark current page, add ✨ to fresh ones, build hover meta.
    (function () {
      const FRESH_DAYS = 14;
      const cutoff = Date.now() - FRESH_DAYS * 86400000;

      document.querySelectorAll('.sidebar-nav a').forEach(a => {
        const href = a.getAttribute('href');            // "?paper=changelog"
        const linkPaper = new URLSearchParams(href.split('?')[1]).get('paper');
        if (linkPaper === PAPER) a.setAttribute('aria-current', 'page');

        const date = a.dataset.date;
        if (date) {
          const dt = Date.parse(date.replace(/\./g, '-'));
          if (Number.isFinite(dt) && dt >= cutoff) {
            a.insertAdjacentHTML('beforeend', ' <span class="sidebar-new">✨</span>');
          }
        }

        const parts = [];
        if (a.dataset.words)   parts.push(`${(+a.dataset.words).toLocaleString()} WORDS`);
        if (a.dataset.minutes) parts.push(`${a.dataset.minutes} MIN`);
        if (date)              parts.push(`UPD ${date}`);
        if (parts.length) {
          const meta = parts.join(' · ');
          a.title = meta.replace(/·/g, '-');
          a.closest('li').insertAdjacentHTML('beforeend',
            `<span class="nav-meta"><span>${meta}</span></span>`);
        }
      });
    })();

    // 4) Fill the theme picker. Wrapped in DOMContentLoaded so Themes exists.
    document.addEventListener('DOMContentLoaded', () => {
      const picker = document.querySelector('.theme-picker');
      if (!picker || typeof Themes === 'undefined') return;

      Themes.FLAVORS.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'theme-swatch';
        btn.type = 'button';
        btn.dataset.themeId = t.id;
        btn.dataset.tooltip = t.label;
        btn.dataset.tooltipColor = t.hex;
        btn.setAttribute('aria-label', t.label + ' theme');
        btn.style.setProperty('--sw', t.hex);
        picker.appendChild(btn);
      });

      const swatches = picker.querySelectorAll('.theme-swatch');
      const markActive = id => swatches.forEach(b =>
        b.classList.toggle('active', b.dataset.themeId === id));

      markActive(Themes.resolve());

      swatches.forEach(btn => {
        btn.addEventListener('click', () => {
          if ('themeReset' in btn.dataset) {
            markActive(Themes.clear().id);
            return;
          }
          Themes.save(btn.dataset.themeId);
          markActive(btn.dataset.themeId);
        });
      });
    });
  </script>
