  <script>
    // Ping a Minecraft server and update the status spans
    function ping(id, host, port) {
      var statusEl = document.getElementById(id + '-status');
      var playersEl = document.getElementById(id + '-players');
      var versionEl = document.getElementById(id + '-version');

      var url = 'https://api.mcsrvstat.us/2/' + host + (port ? ':' + port : '');
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.online) {
            if (statusEl) { statusEl.textContent = 'Online'; statusEl.style.color = '#33ff33'; }
            if (playersEl) { playersEl.textContent = data.players.online + ' / ' + data.players.max; }
            if (versionEl) { versionEl.textContent = data.version; }
          } else {
            if (statusEl) { statusEl.textContent = 'Offline'; statusEl.style.color = '#ff3333'; }
            if (playersEl) { playersEl.textContent = ' - '; }
            if (versionEl) { versionEl.textContent = ' - '; }
          }
        })
        .catch(function() {
          if (statusEl) { statusEl.textContent = 'Error'; statusEl.style.color = '#ff3333'; }
          if (playersEl) { playersEl.textContent = ' - '; }
          if (versionEl) { versionEl.textContent = ' - '; }
        });
    }

    // Ping all servers after page loads
    document.addEventListener('DOMContentLoaded', function() {
      ping('server1', 'play.coffeeblock.xyz');
      ping('server2', 'modded.coffeeblock.xyz');
      ping('server3', 'thefoxden.live');
      ping('server4', 'trinkbell.coffeeblock.xyz', 25568);
    });
  </script>
