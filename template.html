<body>

  <sidebar>
    <!-- Placeholder for dynamic sidebar content -->
  </sidebar>

  <!-- Main Content -->
  <main>

    <div class="download-bar">
      <h1 id="page-title">Loading…</h1>
      <button class="download-btn" onclick="window.print()">Save as PDF</button>
    </div>

    <script data-brewdown="papers/index.md"></script>

    <button id="back-to-top">Back to Top</button>
  </main>

  <script>
  (async () => {
    const tag  = document.querySelector('script[data-brewdown]');
    const path = tag.getAttribute('data-brewdown');

    const md = await (await fetch(path)).text();

    const firstLine = md.split('\n')[0];
    const match = firstLine.match(/^#\s+(\S+)\s+(.+)$/);

    if (match) {
      const [, icon, title] = match;
      document.getElementById('page-title').textContent = title;
      document.title = title + ' - Coffee Byte Dev';
      window.icon  = icon;
      window.title = title;
      md = md.slice(firstLine.length + 1);
    }

    brewdown.render(md, tag);
  })();
</script>
</body>
